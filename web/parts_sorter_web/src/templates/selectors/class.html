<article class="card user-select-none">
    <button class="btn card-header p-0 ps-1 pe-1 d-flex justify-content-between align-items-center collapsed"
            type="button" 
            data-bs-toggle="collapse"
            data-bs-target="#classSelectorCollapseCard" 
            aria-expanded="true"
            aria-controls="classSelectorCollapseCard"
    >
        <span class="fs-8 fst-italic p-0">Classes:</span>
        <span class="bi bi-caret-up-square fs-5"></span>
    </button>
    <section class="card-body collapse p-1 show" id="classSelectorCollapseCard">
        <ul class="list-group">
            <li class="list-group-item p-0 ps-1 pe-1 text-truncate">
                <label class="d-flex gap-1">
                    <input class="form-check-input" type="checkbox" name="classSelectorOption" value="No result">
                    No result
                </label>
            </li>
            {% for class in classes: %}
                <li class="list-group-item p-0 ps-1 pe-1 text-truncate">
                    <label class="d-flex gap-1">
                        <input class="form-check-input" type="checkbox" name="classSelectorOption" value="{{ class.name }}">
                        {{ class.name }}
                    </label>
                </li>
            {% endfor %}
        </ul>
    </section>

    <script
        src="{{ url_for('static', filename='js/selectors/class.js') }}"
        type="module">
    </script>
</article>

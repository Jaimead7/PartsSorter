[build-system]
    requires = ["setuptools>=61.0", "wheel"]
    build-backend = "setuptools.build_meta"

[project]
    name = "jaimead7-parts-sorter-web"
    version = "0.0.1"
    description = "WebApp for a parts sorter system."
    authors = [
        {name = "Jaime Álvarez", email = "alvarez.diaz.jaime1@gmail.com"},
    ]
    maintainers = [
        {name = "Jaime Álvarez", email = "alvarez.diaz.jaime1@gmail.com"},
    ]
    readme = {file = "README.md", content-type = "text/markdown"}
    license = "MIT"
    license-files = [
        "LICENSE",
    ]
    keywords = [
        "WebApp",
    ]
    classifiers = [
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
    ]
    dependencies = [
        "jaimead7-pyutils >= 0.2.0",
        "quart >= 0.20.0",
        "uvicorn[standard] >= 0.35.0",
        "httpx >= 0.28.1",
        "pydantic >= 2.12.5"
    ]
    requires-python = ">=3.10, <3.14"

    [project.optional-dependencies]
        dev = [
            "pytest"
        ]

    [project.urls]
        Homepage = "https://github.com/Jaimead7/PartsSorter/web"
        Repository = "https://github.com/Jaimead7/PartsSorter"

[tool.setuptools.packages.find]
    where = ['.']
    include = ['*']
    exclude = ['licenses']

<article class="card user-select-none">
    <button class="btn card-header p-0 ps-1 pe-1 d-flex justify-content-between align-items-center collapsed"
            type="button" 
            data-bs-toggle="collapse"
            data-bs-target="#imageTrustFilterCollapseCard" 
            aria-expanded="false"
            aria-controls="imageTrustFilterCollapseCard"
    >
        <span class="fs-8 fst-italic p-0">Trust:</span>
        <span class="bi bi-caret-down-square fs-5"></span>
    </button>
    <section class="card-body collapse p-1"  id="imageTrustFilterCollapseCard">
        <ul class="list-group">
            <li class="list-group-item p-1 text-truncate d-flex align-items-center justify-content-between">
                <label for="imageTrustMinFilter">Min:</label>
                <div class="col-9 d-flex">
                    <input id="imageTrustMinFilter"
                        type="range"
                        min="0"
                        max="100"
                        value="0"
                        step="0.1"
                        class="col-8"
                    >
                    <label for="imageTrustMinFilter" class="col-4 text-end" id="imageTrustMinFilterLabel">0%</label>
                </div>
            </li>
            <li class="list-group-item p-1 text-truncate d-flex align-items-center justify-content-between">
                <label for="imageTrustMaxFilter">Max:</label>
                <div class="col-9 d-flex">
                    <input id="imageTrustMaxFilter"
                        type="range"
                        min="0"
                        max="100"
                        value="100"
                        step="0.1"
                        class="col-8"
                    >
                    <label for="imageTrustMaxFilter" class="col-4 text-end" id="imageTrustMaxFilterLabel">100%</label>
                </div>
            </li>
        </ul>
    </section>

    <script src="{{ url_for('static', filename='js/filters/image/trust.js') }}"></script>
</article>

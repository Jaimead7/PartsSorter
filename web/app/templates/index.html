<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>{{ page_title }}</title>
        <meta name="description" content="Part sorter web interface."/>
        <meta name="author" content="Jaime Álvarez Díaz"/>
        <meta name="robots" content="noindex,nofollow"/>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
        <link
            href="{{ url_for('static', filename='images/favicon.png') }}"
            rel="shortcut icon"
            type="image/x-icon"
        />
        <link href="{{ url_for('static', filename='styles/custom-dark.css') }}" rel="stylesheet"/>
        {% block styles %}{% endblock %}
    </head>

    <body class="container-fluid p-0">
        <header>
            {% include 'components/navbar.html' %}
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
        <footer>

        </footer>
        {% block scripts %}{% endblock %}
        <script src="{{ url_for('static', filename='js/components/navbar.js') }}"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous">
        </script>
    </body>
</html>

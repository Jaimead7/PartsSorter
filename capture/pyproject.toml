[project]
    name = "jaimead7-parts-sorter-capture"
    version = "0.0.1"
    description = "Image capture for a parts sorter system."
    authors = [
        {name = "Jaime Álvarez", email = "alvarez.diaz.jaime1@gmail.com"},
    ]
    maintainers = [
        {name = "Jaime Álvarez", email = "alvarez.diaz.jaime1@gmail.com"},
    ]
    readme = {file = "README.md", content-type = "text/markdown"}
    license = "MIT"
    license-files = [
        "LICENSE",
    ]
    keywords = [
        "Camera",
    ]
    classifiers = [
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
    ]
    dependencies = [
        "jaimead7-pyutils >= 0.2.0",
        "httpx >= 0.28.1",
        "opencv-python-headless >= 4.11.0.86",
        "pydantic >= 2.12.3",
        "gpiod >= 2.3.0; sys_platform == 'linux' and platform_machine == 'aarch64'",
    ]
    requires-python = ">=3.10"

    [project.urls]
        Homepage = "https://github.com/Jaimead7/PartsSorter/capture"
        Repository = "https://github.com/Jaimead7/PartsSorter"

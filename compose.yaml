name: parts-sorter

services:
  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: label-studio
    ports:
      - "8080:8080"
    volumes:
      - label-studio-volume:/label-studio/data
      - images-volume:/local-storage/images
    environment:
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/local-storage/images/training

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    env_file:
      - path: ./postgres/.env.docker
        required: true
    ports:
      - "5432:5432"
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - db-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - path: ./api/.env.docker
        required: true
    ports:
      - "8000:8000"
    volumes:
      - images-volume:/api/dist/images
      - models-volume:/api/dist/models
      - datasets-volume:/api/dist/datasets
      - logs-volume:/api/dist/logs
    networks:
      - db-network
      - api-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: web
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - path: ./web/.env.docker
        required: true
    ports:
      - "5000:5000"
    volumes:
      - logs-volume:/app/dist/logs
    networks:
      - api-network


volumes:
  postgres-volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${POSTGRES_VOLUME_PATH:-/mnt/shared/postgres}
    external: false
    labels:
      - "description=PostgreSQL data volume."
  label-studio-volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LABEL_STUDIO_VOLUME_PATH:-/mnt/shared/label-studio}
    external: false
    labels:
      - "description=Label studio data volume."
  images-volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${IMAGES_VOLUME_PATH:-/mnt/shared/images}
    external: false
    labels:
      - "description=Images volume."
  models-volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MODELS_VOLUME_PATH:-/mnt/shared/models}
    external: false
    labels:
      - "description=Models volume."
  datasets-volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATASETS_VOLUME_PATH:-/mnt/shared/datasets}
    external: false
    labels:
      - "description=Datasets volume."
  logs-volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LOGS_VOLUME_PATH:-/mnt/shared/logs}
    external: false
    labels:
      - "description=Logs volume."


networks:
  db-network:
    driver: bridge
  api-network:
    driver: bridge
